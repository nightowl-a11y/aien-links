<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>AIEN 링크 모음</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#5d6575;--line:#d6dae1;--acc:#2f5bea;--err:#c62f2f}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1e232b;--ink:#e8ebf0;--sub:#9aa3b2;--line:#363d48;--acc:#7a9bff;--err:#ff7b7b}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:100%;max-width:380px}
h1{margin:0 0 6px;font-size:20px}p{margin:0 0 18px;color:var(--sub);font-size:14px}
input{width:100%;font:inherit;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;border:1px solid var(--line);
border-radius:10px;background:transparent;color:var(--ink)}input:focus{outline:2px solid var(--acc);border-color:transparent}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#m{margin:14px 0 0;min-height:1.4em}#m.err{color:var(--err)}
</style></head>
<body><form id="f" autocomplete="off">
<h1>AIEN 링크 모음</h1><p>안내받은 접속 코드를 입력해 주세요.</p>
<input id="c" placeholder="XXXX-XXXX-XXXX" aria-label="접속 코드" autofocus spellcheck="false">
<button id="b">열기</button><p id="m" role="status"></p></form>
<script>
const SALT="+I2XdgzMb53/uv5I5as/Rw==",ITER=600000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let key;
async function dec(name){const r=await fetch("d/"+name,{cache:"no-store"});if(!r.ok)throw new Error("파일을 받지 못했어요 ("+r.status+")");
 const b=new Uint8Array(await r.arrayBuffer());return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},key,b.slice(12));}
const say=(t,err)=>{const m=document.getElementById("m");m.textContent=t;m.className=err?"err":""};
document.getElementById("f").onsubmit=async e=>{
 e.preventDefault();const btn=document.getElementById("b");
 const code=document.getElementById("c").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(!code){say("접속 코드를 입력해 주세요.",1);return}
 btn.disabled=true;say("확인 중…");
 try{
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let man;try{man=JSON.parse(new TextDecoder().decode(await dec("m.bin")))}catch(_){say("접속 코드가 맞지 않아요. 다시 확인해 주세요.",1);btn.disabled=false;return}
  const url={},text={};let n=0;
  await Promise.all(man.files.map(async x=>{const buf=await dec(x.f);
   if(x.t==="text/html")text[x.p]=new TextDecoder().decode(buf);else url[x.p]=URL.createObjectURL(new Blob([buf],{type:x.t}));
   say("불러오는 중… "+(++n)+" / "+man.files.length)}));
  const dirOf=p=>p.includes("/")?p.slice(0,p.lastIndexOf("/")+1):"";
  const fix=page=>{let h=text[page];const d=dirOf(page);
   for(const [p,u] of Object.entries(url)){if(!p.startsWith(d))continue;const r=p.slice(d.length),name=p.split("/").pop();
    h=h.split('href="'+r+'" download>').join('href="'+u+'" download="'+name+'">')
       .split('href="'+r+'"').join(text[p]!==undefined?'href="'+u+'" target="_blank"':'href="'+u+'"')
       .split('src="'+r+'"').join('src="'+u+'"').split('poster="'+r+'"').join('poster="'+u+'"')}
   // 실행 중에 정하는 경로도 연결 (예: im.src=f.img, 'assets/voices/'+이름+'.mp3') — 페이지 맨 앞에 넣는 작은 스크립트
   const M={};for(const [p,u] of Object.entries(url))if(p.startsWith(d))M[p.slice(d.length)]=u;
   const patch='<script>(function(M){function f(v){if(typeof v!=="string")return v;return M[v.replace(/^\\.\\//,"")]||v}'
    +'[[HTMLMediaElement,"src"],[HTMLImageElement,"src"],[HTMLSourceElement,"src"],[HTMLScriptElement,"src"],[HTMLAnchorElement,"href"]].forEach(function(p){'
    +'var o=Object.getOwnPropertyDescriptor(p[0].prototype,p[1]);Object.defineProperty(p[0].prototype,p[1],{get:o.get,set:function(v){o.set.call(this,f(v))},configurable:true})});'
    +'var sa=Element.prototype.setAttribute;Element.prototype.setAttribute=function(n,v){if(/^(src|href|poster)$/i.test(n))v=f(v);return sa.call(this,n,v)}})('
    +JSON.stringify(M)+')<\/script>';
   return /<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+patch):patch+h};
  const subs=Object.keys(text).filter(p=>p!==man.main).sort((a,b)=>b.split("/").length-a.split("/").length);
  // 하위 페이지는 새 탭으로 열림 → 그 안의 '메인으로 돌아가기' 링크는 탭을 닫아 원래 화면으로
  const back=new RegExp('href="(?:\\.\\./)+'+man.main.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+'(?:#[^"]*)?"',"g");
  for(const p of subs)url[p]=URL.createObjectURL(new Blob([fix(p).replace(back,'href="#" onclick="window.close();return false"')],{type:"text/html"}));
  const html=fix(man.main);
  document.open();document.write(html);document.close();
 }catch(err){say("불러오지 못했어요: "+err.message,1);btn.disabled=false}
};
</script></body></html>
